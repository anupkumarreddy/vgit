name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Check, lint, and test
    # GPUI is developed and validated on macOS. Windows and Linux builds are
    # not yet supported, so CI does not gate on them.
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --manifest-path native/Cargo.toml --check

      - name: Lint
        run: cargo clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --manifest-path native/Cargo.toml

      - name: Build
        run: cargo build --locked --manifest-path native/Cargo.toml

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit advisories
        run: cargo audit --file native/Cargo.lock
